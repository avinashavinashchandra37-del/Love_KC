<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6; /* Soft pink background */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Prevents scrollbars when 'No' button flies to the edges */
        }
        
        h1 {
            color: #ff4d4d;
            font-size: 3rem;
            text-align: center;
            z-index: 10;
        }

        .buttons-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #yes-btn {
            background-color: #4CAF50; /* Green */
            color: white;
            transition: transform 0.3s ease, font-size 0.3s ease; /* Smooth growing animation */
        }

        #yes-btn:hover {
            background-color: #45a049;
        }

        #no-btn {
            background-color: #f44336; /* Red */
            color: white;
            position: relative; /* Will change to absolute on hover */
            transition: top 0.2s ease, left 0.2s ease; /* Smooth dodging */
        }
        
        /* Message shown after clicking Yes */
        #success-message {
            display: none;
            color: #ff4d4d;
            font-size: 3rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1 id="question">Do you love me? ❤️</h1>
    
    <div class="buttons-container" id="btn-container">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>

    <div id="success-message">I knew it! 🥰💖</div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const question = document.getElementById('question');
        const btnContainer = document.getElementById('btn-container');
        const successMessage = document.getElementById('success-message');
        
        let yesScale = 1; // Tracks how big the Yes button gets

        // Logic for the 'No' button moving
        noBtn.addEventListener('mouseover', () => {
            // Change position to absolute so it can freely move across the screen
            noBtn.style.position = 'absolute';

            // Calculate random X and Y coordinates within the browser window limits
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Apply new position
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            // Make the Yes button bigger each time No is dodged
            yesScale += 0.4;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        // Logic for clicking the 'Yes' button
        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            btnContainer.style.display = 'none';
            successMessage.style.display = 'block';
        });
    </script>

</body>
</html>
