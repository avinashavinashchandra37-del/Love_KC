<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bayko ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        /* Auth Screen Styles */
        #auth-screen {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 20;
        }

        #auth-screen h2 {
            color: #ff4d4d;
            margin-bottom: 10px;
        }

        #auth-screen input {
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #ff9999;
            border-radius: 5px;
            margin-top: 15px;
            width: 80%;
            text-align: center;
        }

        #auth-btn {
            margin-top: 20px;
            background-color: #ff4d4d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #auth-error {
            color: red;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* Main Game Styles */
        #main-screen {
            display: none; 
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ff4d4d;
            font-size: 3rem;
            text-align: center;
            z-index: 10;
        }

        .buttons-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #yes-btn {
            background-color: #4CAF50;
            color: white;
            transition: transform 0.3s ease, font-size 0.3s ease;
        }

        #yes-btn:hover {
            background-color: #45a049;
        }

        #no-btn {
            background-color: #f44336;
            color: white;
            position: relative;
            transition: top 0.2s ease, left 0.2s ease;
            z-index: 999;
        }
        
        #success-message {
            display: none;
            color: #d32f2f;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
        }

        #no-count-display {
            font-size: 1.5rem;
            color: #333;
            margin-top: 15px;
        }

        /* EMOJI ANIMATIONS */
        .emoji {
            position: absolute;
            font-size: 2rem;
            pointer-events: none; 
            z-index: 5;
        }

        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        @keyframes dropDown {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Surprise Pop-up Styles */
        #surprise-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.6);
            text-align: center;
            z-index: 9999;
            font-size: 2.2rem;
            color: #d32f2f;
            font-weight: bold;
            border: 4px solid #ff4d4d;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .firecracker {
            position: absolute;
            font-size: 4rem;
            animation: explode 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 10000;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. The Secret Gatekeeper Screen -->
    <div id="auth-screen">
        <h2>Hold on! 🛑</h2>
        <p>What exactly do you call me when I do something really dumb?</p>
        
        <input type="text" id="secret-answer" placeholder="Type answer here...">
        <br>
        <button id="auth-btn">Unlock</button>
        <p id="auth-error">That's not it! Try again.</p>
    </div>

    <!-- 2. The Main Question Screen -->
    <div id="main-screen">
        <h1 id="question">Do you love me? ❤️</h1>
        
        <div class="buttons-container" id="btn-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <!-- 3. The Success Screen -->
    <div id="success-message">
        I was waiting for your yes! I love you too! 🥰💖
        <div id="no-count-display"></div>
    </div>

    <!-- Surprise Pop-up -->
    <div id="surprise-popup">
        🎇 Surprise for you is getting ready! 🎇
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- AUTHENTICATION LOGIC ---
        // REPLACE "your_nickname_here" WITH THE ACTUAL NICKNAME (keep it all lowercase)
        const CORRECT_ANSWER = "box"; 

        const authBtn = document.getElementById('auth-btn');
        const authInput = document.getElementById('secret-answer');
        const authError = document.getElementById('auth-error');
        const authScreen = document.getElementById('auth-screen');
        const mainScreen = document.getElementById('main-screen');
        const bgMusic = document.getElementById('bg-music');

        authBtn.addEventListener('click', () => {
            const userAnswer = authInput.value.trim().toLowerCase();
            if (userAnswer === CORRECT_ANSWER) {
                authScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
                
                bgMusic.play().catch(error => {
                    console.log("Browser blocked audio, user must click first.");
                });
            } else {
                authError.style.display = 'block';
            }
        });

        // --- GAME LOGIC ---
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const question = document.getElementById('question');
        const btnContainer = document.getElementById('btn-container');
        const successMessage = document.getElementById('success-message');
        const noCountDisplay = document.getElementById('no-count-display');
        const surprisePopup = document.getElementById('surprise-popup');
        
        let yesScale = 1; 
        let noCount = 0; 

        function createSadEmoji(x, y) {
            const emojis = ['😢', '😭', '💔', '🥺'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            const emojiEl = document.createElement('div');
            emojiEl.classList.add('emoji');
            emojiEl.innerText = randomEmoji;
            emojiEl.style.left = `${x}px`;
            emojiEl.style.top = `${y}px`;
            emojiEl.style.animation = 'floatUpFade 2s forwards';
            
            document.body.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.remove();
            }, 2000);
        }

        function dodgeButton(event) {
            noCount++; 

            const rect = noBtn.getBoundingClientRect();
            createSadEmoji(rect.left + 20, rect.top);

            noBtn.style.position = 'absolute';

            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            yesScale += 0.4;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('click', dodgeButton);
        
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            dodgeButton();
        });

        // --- SUCCESS LOGIC (Hearts, Message & Pop-up) ---
        function spawnHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('emoji');
                heart.innerText = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
                heart.style.animation = `dropDown ${Math.random() * 2 + 2}s linear forwards`;
                
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000); 
            }, 150); 
        }

        function spawnFirecrackers() {
            const crackers = ['🎆', '🎇', '🎉', '✨'];
            for(let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const cracker = document.createElement('div');
                    cracker.classList.add('firecracker');
                    cracker.innerText = crackers[Math.floor(Math.random() * crackers.length)];
                    cracker.style.left = Math.random() * 100 + 'vw';
                    cracker.style.top = Math.random() * 100 + 'vh';
                    document.body.appendChild(cracker);
                    
                    setTimeout(() => cracker.remove(), 800);
                }, i * 150); 
            }
        }

        yesBtn.addEventListener('click', () => {
            mainScreen.style.display = 'none';
            successMessage.style.display = 'block';
            
            if (noCount === 0) {
                noCountDisplay.innerText = "You clicked Yes on the first try! Perfect! 🥰";
            } else {
                noCountDisplay.innerText = `Haha, you tried to click 'No' ${noCount} times before giving up! 😂`;
            }

            spawnHearts();

            // Date Restriction: September 11, 2026
            const currentDate = new Date();
            const isToday = (currentDate.getFullYear() === 2026 && currentDate.getMonth() === 8 && currentDate.getDate() === 11);

            if (isToday) {
                setTimeout(() => {
                    surprisePopup.style.display = 'block';
                    spawnFirecrackers();
                }, 2000);
            }
        });
    </script>
</body>
    </html>
