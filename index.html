<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bayko Scavenger Hunt 🗺️❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fdf2f8; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background: white;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.15);
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
            text-align: center;
            margin: 20px 0;
        }

        h1 {
            color: #db2777;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .clue-text {
            font-size: 1.1rem;
            color: #374151;
            margin-bottom: 20px;
            line-height: 1.5;
            background: #fdf2f8;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #db2777;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #fbcfe8;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 10px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #db2777;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background-color: #db2777;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, background 0.3s;
            box-shadow: 0 4px 10px rgba(219, 39, 119, 0.3);
        }

        .action-btn:active { transform: scale(0.98); }
        .action-btn:hover { background-color: #be185d; }

        .hint-btn {
            background-color: #fbcfe8;
            color: #be185d;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none; 
        }

        .error-msg {
            color: red;
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 10px;
            display: none;
            font-weight: bold;
        }

        /* Screen Shake Animation */
        .shake {
            animation: shake-animation 0.4s ease-in-out;
        }

        @keyframes shake-animation {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        /* Scratch Card Styles */
        #hint-section {
            display: none;
            margin-bottom: 20px;
        }
        .scratch-container {
            position: relative;
            width: 100%;
            height: 80px;
            background: #fff;
            border: 2px dashed #fbcfe8;
            border-radius: 8px;
            overflow: hidden;
        }
        .hint-secret-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: #be185d;
            font-weight: bold;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            touch-action: none;
            cursor: crosshair;
        }

        /* Hide sections initially */
        #success-screen { display: none; }

        /* Success Screen */
        .stamp {
            color: #16a34a; font-size: 3rem; font-weight: bold; border: 6px solid #16a34a;
            padding: 10px 25px; border-radius: 12px; display: inline-block;
            transform: rotate(-15deg) scale(3); opacity: 0; margin: 30px 0;
        }
        .stamp.animate { animation: stampIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stampIn {
            0% { transform: rotate(-15deg) scale(3); opacity: 0; }
            100% { transform: rotate(-15deg) scale(1); opacity: 1; }
        }
        .floating-heart {
            position: fixed; font-size: 2rem; pointer-events: none; z-index: 5;
            animation: floatUp 4s linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="hunt-screen">
        <h1 id="clue-title">Clue #1 🕵️‍♀️</h1>
        <div class="clue-text" id="clue-desc">Loading clue...</div>

        <!-- Hint Button & Scratch Card Area -->
        <button class="hint-btn" id="show-hint-btn" onclick="revealHintArea()">Need a Hint? 💡</button>
        
        <div id="hint-section">
            <p style="font-size:0.85rem; color:#6b7280; margin-top:0; margin-bottom:5px;">Scratch the silver card below! 🪙</p>
            <div class="scratch-container">
                <div id="hint-secret-text" class="hint-secret-text">Hidden Hint</div>
                <canvas id="scratch-canvas"></canvas>
            </div>
        </div>

        <input type="text" id="hunt-ans" placeholder="Enter the secret word...">
        <div class="error-msg" id="hunt-err">Nope! Keep looking!</div>
        <button class="action-btn" onclick="checkAnswer()">Verify & Next ➡️</button>
    </div>

    <!-- THE SUCCESS SCREEN (Appears immediately after last clue) -->
    <div class="container" id="success-screen">
        <h1>Hunt Completed!</h1>
        <div class="stamp" id="approved-stamp">APPROVED ✅</div>
        <p style="font-size: 1.2rem; color: #374151; font-weight: bold;" id="applicant-display">Congratulations, my Bayko!</p>
        <p style="font-size: 1rem; color: #db2777; margin-top: 15px;">
            You have successfully completed the hunt. Lifetime subscription to Avinash activated! 🥰
        </p>
        <p style="font-size: 0.9rem; color: #6b7280; margin-top: 15px; font-style: italic;" id="penalty-display"></p>
    </div>

    <script>
        const allClues = [
            { icon: "👟", ans: "shoes", clue: "I take you to places, but I never move on my own. I have a tongue but cannot speak, and my favorites are white or tan.", hint: "Look near my white sneakers and tan suede loafers!" },
            { icon: "💪", ans: "gains", clue: "I am the fuel for the muscles, kept where it's always winter. I come in shells, jugs, and tubs.", hint: "Check the fridge near the eggs, milk, and curd." },
            { icon: "🚗", ans: "drive", clue: "I hold the power to take us to Indore again, but right now, I'm just hanging around.", hint: "Look exactly where we keep the car keys!" },
            { icon: "✨", ans: "date", clue: "We weren't on one, but you smelled like one. A sweet memory trapped in a little bottle.", hint: "Check near your Bella Vita 'Date' perfume." },
            { icon: "👜", ans: "gucci", clue: "I have my own dedicated house inside our house. I carry your things, and the favorites have two C's.", hint: "Look inside your dedicated bag cupboard (check the Gucci!)." },
            { icon: "🦄", ans: "uunty", clue: "I am magical, huge, and I live with you. I might not be a real animal, but I have a highly respected status.", hint: "Ask your giant unicorn soft toy (Uunty)!" },
            { icon: "💫", ans: "bangles", clue: "We jingle and jangle, a beautiful new Kashmiri addition to a golden red double-boxed collection.", hint: "Check inside your two bangle boxes!" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        shuffleArray(allClues);
        let currentStep = 0;
        let wrongGuessCount = 0;
        let hintTimerId = null;

        const huntScreen = document.getElementById('hunt-screen');
        const clueTitle = document.getElementById('clue-title');
        const clueDesc = document.getElementById('clue-desc');
        const huntAns = document.getElementById('hunt-ans');
        const huntErr = document.getElementById('hunt-err');
        const hintSection = document.getElementById('hint-section');
        const showHintBtn = document.getElementById('show-hint-btn');
        const hintSecretText = document.getElementById('hint-secret-text');
        
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function loadClue() {
            const currentData = allClues[currentStep];
            clueTitle.innerText = `Clue #${currentStep + 1} ${currentData.icon}`;
            clueDesc.innerText = currentData.clue;
            hintSecretText.innerText = currentData.hint;
            
            huntAns.value = "";
            huntErr.style.display = "none";
            hintSection.style.display = "none";
            showHintBtn.style.display = "none"; 

            if (hintTimerId) clearTimeout(hintTimerId);
            
            hintTimerId = setTimeout(() => {
                showHintBtn.style.display = "inline-block";
            }, 30000); 
        }

        function revealHintArea() {
            showHintBtn.style.display = "none";
            hintSection.style.display = "block";
            
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#d1d5db'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 16px Arial';
            ctx.fillStyle = '#6b7280';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SCRATCH ME', canvas.width/2, canvas.height/2);
        }

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch, {passive: false});

        function spawnHearts() {
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('floating-heart');
                    heart.innerText = ['❤️', '💖', '🥰', '✨', '🦄'][Math.floor(Math.random() * 5)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 150); 
            }
        }

        function checkAnswer() {
            const userAnswer = huntAns.value.trim().toLowerCase();
            const correctAnswer = allClues[currentStep].ans;

            if (userAnswer === correctAnswer) {
                currentStep++;
                if (currentStep < allClues.length) {
                    loadClue();
                } else {
                    // Hunt is over! Show the success screen directly.
                    if (hintTimerId) clearTimeout(hintTimerId); 
                    huntScreen.style.display = 'none';
                    
                    const successScreen = document.getElementById('success-screen');
                    const stamp = document.getElementById('approved-stamp');
                    const penaltyDisplay = document.getElementById('penalty-display');
                    
                    successScreen.style.display = 'block';

                    if (wrongGuessCount > 0) {
                        penaltyDisplay.innerText = `PS: You had ${wrongGuessCount} wrong guesses during the hunt. You owe Avinash ${wrongGuessCount} kisses as a penalty! 😘`;
                    } else {
                        penaltyDisplay.innerText = "Flawless victory! 0 wrong guesses. You are officially brilliant. 👑";
                    }

                    setTimeout(() => { stamp.classList.add('animate'); }, 100);
                    spawnHearts(); 
                }
            } else {
                wrongGuessCount++;
                huntErr.style.display = 'block';
                
                huntScreen.classList.remove('shake');
                void huntScreen.offsetWidth; 
                huntScreen.classList.add('shake');

                const errorMessages = [
                    "Nope! Keep looking!",
                    "Uunty is judging you right now... 🦄",
                    "Not quite! Check again.",
                    "Are you even trying, Box Fellow? 📦",
                    "That's definitely not it!"
                ];
                huntErr.innerText = errorMessages[Math.floor(Math.random() * errorMessages.length)];
            }
        }

        // Start the game
        loadClue();
    </script>
</body>
    </html>
